
spring.application.name=incident-api

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/incidentdb}
spring.datasource.username=${DB_USERNAME:incident}
spring.datasource.password=${DB_PASSWORD}

# JPA et Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

# JWT
security.jwt.secret=${JWT_SECRET}
