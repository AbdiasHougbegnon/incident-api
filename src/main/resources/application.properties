
spring.application.name=incident-api

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/incidentdb}
spring.datasource.username=${DB_USERNAME:incident}
spring.datasource.password=${DB_PASSWORD}

# JPA et Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

# JWT
security.jwt.secret=${JWT_SECRET}

# Compte administrateur initial (optionnel, créé une seule fois au démarrage)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Observabilité
# Port de gestion separe du port applicatif : non expose a l'hote dans docker-compose,
# uniquement joignable depuis le reseau Docker interne (ex. Prometheus). L'isolation
# reseau remplace ici un controle par role, puisqu'un scraper ne peut pas se reconnecter
# avec un JWT qui expire toutes les heures.
management.server.port=9001
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
logging.structured.format.console=logstash
