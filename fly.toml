# Scaffold de deploiement Fly.io. Inactif tant que FLY_API_TOKEN n'est pas
# configure (voir README, section "Activer le deploiement reel"). L'app par
# defaut ci-dessous cible l'environnement de staging ; la prod est deployee
# en remplacant --app incident-api-prod dans le workflow de promotion.
app = "incident-api-staging"
primary_region = "cdg"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

# NOTE: /actuator/health vit sur un port de gestion separe (9001, voir
# application.properties), non expose publiquement. Le controle de sante
# Fly ci-dessus se contente donc d'une verification TCP sur le port
# applicatif. Pour un vrai controle de sante applicatif, exposer le port
# 9001 via un service Fly dedie et y pointer un [[http_service.checks]].

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
