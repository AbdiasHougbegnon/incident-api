name: DAST baseline scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate ephemeral secrets
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 16)" >> .env
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> .env
          echo "VAULT_DEV_ROOT_TOKEN=$(openssl rand -hex 16)" >> .env

      - name: Start the application
        run: docker compose up -d --build app

      - name: Wait for the application to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/v3/api-docs && break
            sleep 5
          done

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: 'http://localhost:8080'
          allow_issue_writing: false
          artifact_name: 'zap-scan'
