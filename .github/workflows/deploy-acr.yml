name: Push image to Azure Container Registry

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  push:
    name: Build, test and push to ACR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Run tests and quality checks
        run: ./gradlew clean check

      - name: Build Docker image
        run: docker build -t incident-api:deploy .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: incident-api:deploy
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Tag and push image
        run: |
          docker tag incident-api:deploy ${{ secrets.ACR_LOGIN_SERVER }}/incident-api:${{ github.sha }}
          docker tag incident-api:deploy ${{ secrets.ACR_LOGIN_SERVER }}/incident-api:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/incident-api:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/incident-api:latest
